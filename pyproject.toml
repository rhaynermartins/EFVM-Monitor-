[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "efvm-monitor"
version = "0.6.0"
description = "Monitor de disponibilidade de passagens do Trem de Passageiros EFVM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EFVM Monitor contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pywebpush>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "truststore>=0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
efvm-monitor = "efvm_monitor.cli:main"
efvm-monitor-web = "efvm_monitor.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/efvm_monitor"]

[tool.hatch.build.targets.wheel.force-include]
"src/efvm_monitor/certificates/digicert-global-g2-tls-rsa-sha256-2020-ca1.pem" = "efvm_monitor/certificates/digicert-global-g2-tls-rsa-sha256-2020-ca1.pem"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
